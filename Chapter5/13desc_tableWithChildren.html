<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>13desc_tableWithChildren</title>
    <style>
        table>tbody>tr>th{
            color:salmon;
        }
    </style>
</head>
<body>
    <h2>4.후손 선택자와 자손 선택자</h2>
    <h3>4.2 자손 선택자</h3>
    <p>주의. table 태그에 스타일을 적용할 때는 자손 선택자를 사용하면 안됨.</p>
    <table border="1">
        <tr>
            <th>이름</th>
            <th>지역</th>
        </tr>
        <tr>
            <td>차유나</td>
            <td>서울시 성북구</td>
        </tr>
    </table>
