<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>4form_selectBasic</title>
</head>
<body>
    <h2>한 항목만 선택하기</h2>
    <select>
        <option>웹해킹</option>
        <option>포너블</option>
        <option>리버스 엔지니어링</option>
        <option>크립토</option>
        <option>디지털 포렌식</option>
    </select>

    <h2>여러 항목 선택하기</h2>
    <select multiple="multiple">
        <option>웹해킹</option>
        <option>포너블</option>
        <option>리버스 엔지니어링</option>
        <option>크립토</option>
        <option>디지털 포렌식</option>
    </select>

    <h2>선택 옵션 묶기</h2>
    <select>
        <optgroup label="정보 보안 세부 기술 분야">
            <option>웹해킹</option>
            <option>포너블</option>
            <option>리버스 엔지니어링</option>
            <option>크립토</option>
            <option>디지털 포렌식</option>
        </optgroup>
        <optgroup label="프로그래밍 언어">
            <option>Python</option>
            <option>JavaScript</option>
            <option>Java</option>
            <option>C언어 / C++ / C#</option>
            <option>Kotlin</option>
        </optgroup>
    </select>
</body>
</html>
